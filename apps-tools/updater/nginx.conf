
        location /run_updater {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'DNT,X-Mx-ReqToken,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type';

            default_type text/plain;

            content_by_lua '
                local handle = io.popen("bash /opt/redpitaya/www/apps/updater/scripts/run_updater.sh > /dev/null")
                handle:close()
                ngx.say("OK")
            ';
        }

        location /update_download {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'DNT,X-Mx-ReqToken,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type';

            default_type text/plain;

            content_by_lua_block {
                -- a path under downloads.redpitaya.com: letters, digits and ._/+- only, no "..";
                -- it goes to a shell command line
                local function safe(v)
                    return type(v) == "string" and v ~= "" and #v <= 255 and not v:find("[^%w%._/+-]")
                        and not v:find("..", 1, true) and v:sub(1, 1) ~= "-"
                end
                local ecosystem = ngx.req.get_uri_args()["ecosystem"]
                if not safe(ecosystem) then
                    ngx.status = ngx.HTTP_BAD_REQUEST
                    ngx.say("ERROR: Bad argument")
                    return
                end
                ngx.say(ecosystem)

                local handle = io.popen("bash /opt/redpitaya/www/apps/updater/scripts/killwget.sh > /dev/null")
                handle:close()

                local handle2 = io.popen("bash /opt/redpitaya/www/apps/updater/scripts/download.sh " .. ecosystem .. " > /dev/null &")
                handle2:close()
            }
        }

        location /check_linux_os {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'DNT,X-Mx-ReqToken,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type';

            default_type text/plain;

            content_by_lua_block {
                -- a path under downloads.redpitaya.com: letters, digits and ._/+- only, no "..";
                -- it goes to a shell command line
                local function safe(v)
                    return type(v) == "string" and v ~= "" and #v <= 255 and not v:find("[^%w%._/+-]")
                        and not v:find("..", 1, true) and v:sub(1, 1) ~= "-"
                end
                local args = ngx.req.get_uri_args()
                if not safe(args["type"]) or not safe(args["ecosystem"]) then
                    ngx.status = ngx.HTTP_BAD_REQUEST
                    ngx.say("ERROR: Bad argument")
                    return
                end
                local handle = io.popen("bash /opt/redpitaya/www/apps/updater/scripts/linux_ver.sh " .. args["type"] .. " " .. args["ecosystem"])
                local res = handle:read("*a")
                handle:close()
                ngx.say(res)
            }
        }


        location /get_info {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'DNT,X-Mx-ReqToken,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type';

            default_type application/json;


            content_by_lua '

                local f = io.open("/opt/redpitaya/www/apps/info/info.json", "r")
                local content = f:read("*all")
                content = content:sub(1, -4)
                f:close()

                f = io.popen("/opt/redpitaya/bin/profiles -n")
                local stem_name = f:read("*all"):gsub("^%s*(.-)%s*$", "%1")
                f:close()

                f = io.popen("/opt/redpitaya/bin/profiles -i")
                local stem_version = f:read("*all"):gsub("^%s*(.-)%s*$", "%1")
                f:close()

                local linux_ver = ""
                local f2 = io.open("/root/.version", "r")
                if f2 then
                    linux_ver = f2:read("*all")
                    f2:close()
                end

                ngx.say(content .. [[ ,"stem_ver": ]]  .. stem_version  .. [[\n,"stem_name": ]] .. [[ "]] .. stem_name .. [[" ]] .. [[\n,"sd_linux_ver": ]] .. linux_ver .. "}")

            ';
        }


        location /get_sysinfo {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'DNT,X-Mx-ReqToken,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type';
            add_header 'Content-type' 'text/plain; charset=utf-8';

            default_type text/plain;

            content_by_lua '
                local f = io.open("/tmp/sysinfo.json", "r")
                local content = ""
                if f then
                   content = f:read("*all")
                   f:close()
                end
                ngx.say(content)
            ';
        }

        location /updater_upload_ecosystem {
            client_body_in_file_only on;
            client_body_buffer_size 128k;
            client_max_body_size 500M;

            # The body goes into /home/redpitaya/ecosystems under the name in X-File-Name (URI
            # encoded). The name is a file name only: no shell, no path.
            content_by_lua_block {
                local raw_filename = ngx.var.http_x_file_name or "upload.tmp"
                local filename = ngx.unescape_uri(raw_filename)
                if filename == "" or #filename > 255 or filename == "." or filename == ".."
                    or filename:find("[/\\%z%c]") then
                    ngx.status = ngx.HTTP_BAD_REQUEST
                    ngx.say("Error: Bad file name")
                    return
                end
                ngx.req.read_body()
                local fpath = ngx.req.get_body_file()
                if not fpath then
                    ngx.status = ngx.HTTP_BAD_REQUEST
                    ngx.say("Error: No file uploaded")
                    return
                end
                local dir = "/home/redpitaya/ecosystems/"
                local target = dir .. filename
                -- the body file is nginx's: copied into the directory, then renamed, so the
                -- file shows up whole or not at all
                local part = dir .. ".upload." .. ngx.worker.pid() .. "." .. ngx.now()
                local src = io.open(fpath, "rb")
                local dst = src and io.open(part, "wb")
                local ok = dst ~= nil
                while ok do
                    local chunk = src:read(1048576)
                    if not chunk then
                        break
                    end
                    ok = dst:write(chunk) ~= nil
                end
                if src then
                    src:close()
                end
                if dst then
                    ok = dst:close() and ok
                end
                if not ok or not os.rename(part, target) then
                    os.remove(part)
                    ngx.status = ngx.HTTP_INTERNAL_SERVER_ERROR
                    ngx.say("Error: Can not write the file")
                    return
                end
                ngx.say("Upload successful")
            }
        }

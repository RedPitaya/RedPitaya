
user  root;
worker_processes  1;

env PATH;
env PATH_REDPITAYA;

error_log  /var/log/redpitaya_error.log;
error_log  /var/log/redpitaya_debug.log warn;
#error_log  /var/log/redpitaya_debug.log info;

pid        /run/redpitaya_nginx.pid;

daemon on;

events {
    worker_connections  1024;
}

# worker_rlimit_core 500M;

http {
    include       mime.types;
    default_type  application/octet-stream;

    init_by_lua 'cjson = require "cjson"';
    lua_shared_dict rp_params 10m;
    lua_package_path "/opt/redpitaya/www/conf/lib/lua/?.lua;;";

    client_body_temp_path /tmp;

    access_log /dev/null;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # TODO, it might make sense to configure wersockets to use
    # a simple UNIX socket instead of an IP socket,
    # there should be less overhead
    upstream websocket {
        server 127.0.0.1:9002;
    }

    # Jupyter notebook server
    upstream notebook {
        server 127.0.0.1:8888;
    }

    proxy_temp_path /tmp/proxy 1 2;
    scgi_temp_path  /tmp/scgi 1 2;

    # For the /wsc, /wsu, /wsm and /wsd locations in conf/server_common.conf,
    # which a page loaded over https needs. The servers keep their own ports.
    upstream ws_ctrl {
        server 127.0.0.1:9091;
    }

    upstream ws_update {
        server 127.0.0.1:9092;
    }

    upstream ws_menu {
        server 127.0.0.1:9099;
    }

    upstream ws_stream {
        server 127.0.0.1:9900;
    }

    server {
        listen 80;
        listen [::]:80;

        # ACME http-01 challenge, before the optional redirect: a certificate
        # can only be renewed over port 80, redirect on or not.
        location ^~ /.well-known/acme-challenge/ {
            root /run/acme;
        }

        # Written by the Network Manager when the redirect is on. A wildcard
        # include matching no file is not an error.
        include /etc/redpitaya/nginx/http80/*.conf;

        include /opt/redpitaya/www/conf/server_common.conf;
    }

    # The TLS server block, written by network_manager/scripts/https_apply.sh.
    # On the rootfs because an ecosystem update deletes /opt/redpitaya, and
    # wildcarded so a board with HTTPS off starts exactly as before.
    include /etc/redpitaya/nginx/http/*.conf;

    server {
        listen 81;
        listen [::]:81;
        expires off;

        keepalive_timeout 0;

        access_log /dev/null;

        root /opt/redpitaya/www/apps;
        include ../apps/*/nginx2.conf;

    }
}

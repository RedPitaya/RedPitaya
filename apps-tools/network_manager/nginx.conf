        location /connect_wifi {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'DNT,X-Mx-ReqToken,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type';

            default_type plain/text;

            content_by_lua '
                local function shell_escape(s)
                    local sq = string.char(39)  -- '\''\''
                    local bs = string.char(92)  -- backslash
                    return sq .. tostring(s):gsub(sq, sq .. bs .. sq .. sq) .. sq
                end

                local function is_valid_ssid(s)
                    if not s then return false end
                    local n = #s
                    if n < 1 or n > 32 then return false end
                    if s:find("[%c]") then return false end
                    return true
                end

                local function is_valid_password(s)
                    if not s then return false end
                    local n = #s
                    if n > 0 and (n < 8 or n > 63) then return false end
                    if s:find("[%c]") then return false end
                    return true
                end

                local args = ngx.req.get_uri_args()
                local ssid = args.ssid
                local password = args.password or ""

                if not is_valid_ssid(ssid) then
                    ngx.status = 400
                    ngx.say("error: invalid or missing ssid (1-32 bytes, no control characters)")
                    return
                end

                if not is_valid_password(password) then
                    ngx.status = 400
                    ngx.say("error: invalid password (empty for an open network, otherwise 8-63 characters, no control characters)")
                    return
                end

                local cmd = "/opt/redpitaya/www/apps/network_manager/scripts/connect.sh "
                            .. shell_escape(ssid) .. " " .. shell_escape(password)

                local f = io.popen(cmd)
                local content = f:read("*all")
                f:close()
                ngx.say(content)
            ';
        }


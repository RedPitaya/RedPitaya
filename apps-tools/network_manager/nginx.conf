###############################################################################
# HTTPS
#
# The scripts own the work and the validation; these endpoints only check that
# an argument is the shape it claims to be before it reaches a shell. Run
# through "bash": CMake's install(DIRECTORY scripts ...) drops the execute bit.
###############################################################################

        location /get_https_status {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'DNT,X-Mx-ReqToken,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type';
            add_header 'Cache-Control' 'no-store';

            default_type application/json;

            content_by_lua_block {
                local f = io.popen("bash /opt/redpitaya/www/apps/network_manager/scripts/https_status.sh")
                local content = f:read("*all")
                f:close()
                ngx.say(content)
            }
        }

        location /set_https_config {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'DNT,X-Mx-ReqToken,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type';

            default_type text/plain;

            content_by_lua_block {
                local args     = ngx.req.get_uri_args()
                local enabled  = args.enabled  or "0"
                local port     = args.port     or "443"
                local redirect = args.redirect or "0"
                local source   = args.source   or ""

                if enabled ~= "0" and enabled ~= "1" then
                    ngx.say("error: enabled must be 0 or 1")
                    return
                end
                if redirect ~= "0" and redirect ~= "1" then
                    ngx.say("error: redirect must be 0 or 1")
                    return
                end
                local p = tonumber(port)
                if not p or p < 1 or p > 65535 or p ~= math.floor(p) then
                    ngx.say("error: port must be a whole number between 1 and 65535")
                    return
                end
                if source ~= "" and source ~= "self" and source ~= "upload" and source ~= "acme" then
                    ngx.say("error: unknown certificate source")
                    return
                end

                local cmd = "bash /opt/redpitaya/www/apps/network_manager/scripts/https_apply.sh "
                            .. enabled .. " " .. string.format("%d", p) .. " " .. redirect
                            .. " " .. source .. " 2>&1"
                local f = io.popen(cmd)
                local content = f:read("*all")
                f:close()
                ngx.say(content)
            }
        }

        location /gen_self_signed {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'DNT,X-Mx-ReqToken,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type';

            default_type text/plain;

            content_by_lua_block {
                local args = ngx.req.get_uri_args()
                local cn   = args.cn   or ""
                local san  = args.san  or ""
                local days = args.days or "825"

                -- Names and addresses only, refused rather than quoted and
                -- passed on to a shell.
                if cn ~= "" and not string.match(cn, "^[A-Za-z0-9%.%-]+$") then
                    ngx.say("error: the common name may only contain letters, digits, dots and hyphens")
                    return
                end
                if san ~= "" and not string.match(san, "^[A-Za-z0-9%.%-,]+$") then
                    ngx.say("error: the additional names must be a comma separated list of host names or IP addresses")
                    return
                end
                local d = tonumber(days)
                if not d or d < 1 or d > 3650 or d ~= math.floor(d) then
                    ngx.say("error: validity must be a whole number of days between 1 and 3650")
                    return
                end

                local cmd = "bash /opt/redpitaya/www/apps/network_manager/scripts/https_gen_cert.sh '"
                            .. cn .. "' '" .. san .. "' " .. string.format("%d", d) .. " 2>&1"
                local f = io.popen(cmd)
                local content = f:read("*all")
                f:close()
                ngx.say(content)
            }
        }

        location /install_cert {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'POST, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'DNT,X-Mx-ReqToken,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type';

            default_type text/plain;

            # A chain and a key are a few kilobytes; the cap also keeps the
            # body in memory, out of the body temp directory.
            client_body_buffer_size 256k;
            client_max_body_size 256k;

            content_by_lua_block {
                ngx.req.read_body()
                local body = ngx.req.get_body_data()
                if not body then
                    ngx.say("error: no certificate was sent")
                    return
                end

                local ok, payload = pcall(cjson.decode, body)
                if not ok or type(payload) ~= "table" then
                    ngx.say("error: malformed request")
                    return
                end
                if type(payload.cert) ~= "string" or type(payload.key) ~= "string"
                   or payload.cert == "" or payload.key == "" then
                    ngx.say("error: both the certificate and the private key are required")
                    return
                end

                -- Fixed paths, no client-supplied names near a shell; the
                -- script removes both files either way.
                --
                -- /run, not /tmp: the main configuration serves /tmp to the
                -- network ("location ~ ^/tmp { root /; }"), so a key parked
                -- there would be downloadable while it existed.
                local cert_path = "/run/rp_https_cert.pem"
                local key_path  = "/run/rp_https_key.pem"

                local cf = io.open(cert_path, "w")
                if not cf then ngx.say("error: could not write the certificate to /run") return end
                cf:write(payload.cert)
                cf:close()

                local kf = io.open(key_path, "w")
                if not kf then
                    os.remove(cert_path)
                    ngx.say("error: could not write the private key to /run")
                    return
                end
                kf:write(payload.key)
                kf:close()
                os.execute("chmod 600 " .. key_path)

                local f = io.popen("bash /opt/redpitaya/www/apps/network_manager/scripts/https_install_cert.sh "
                                   .. cert_path .. " " .. key_path .. " 2>&1")
                local content = f:read("*all")
                f:close()
                ngx.say(content)
            }
        }

        # Exact match, like /nm_fonts.css: a prefix location would lose to the
        # "\.crt"-shaped regexes in the shared body if one is ever added.
        location = /download_cert {
            add_header 'Access-Control-Allow-Origin' '*';

            content_by_lua_block {
                local f = io.popen("bash /opt/redpitaya/www/apps/network_manager/scripts/https_export_cert.sh 2>/dev/null")
                local pem = f:read("*all")
                f:close()

                if not pem or not string.find(pem, "BEGIN CERTIFICATE") then
                    ngx.status = 404
                    ngx.header["Content-Type"] = "text/plain"
                    ngx.say("no certificate installed")
                    return
                end

                -- The certificate only; the key stays on the board.
                ngx.header["Content-Type"] = "application/x-x509-ca-cert"
                ngx.header["Content-Disposition"] =
                    'attachment; filename="redpitaya-' .. (ngx.var.hostname or "board") .. '.crt"'
                ngx.header["Cache-Control"] = "no-store"
                ngx.print(pem)
            }
        }

        location /export_bundle {
            add_header 'Access-Control-Allow-Origin' '*';

            client_body_buffer_size 16k;
            client_max_body_size 16k;

            content_by_lua_block {
                ngx.req.read_body()
                local ok, payload = pcall(cjson.decode, ngx.req.get_body_data() or "")
                if not ok or type(payload) ~= "table" or type(payload.password) ~= "string"
                   or #payload.password < 8 then
                    ngx.status = 400
                    ngx.header["Content-Type"] = "text/plain"
                    ngx.say("error: the export password must be at least 8 characters")
                    return
                end

                -- The password goes through a file, not a command line, and
                -- both it and the bundle live in /run, which nothing serves.
                local pw_path = "/run/rp_https_export_pw"
                local out_path = "/run/rp_https_export.p12"
                local pf = io.open(pw_path, "w")
                if not pf then
                    ngx.status = 500
                    ngx.header["Content-Type"] = "text/plain"
                    ngx.say("error: could not write to /run")
                    return
                end
                pf:write(payload.password)
                pf:close()
                os.execute("chmod 600 " .. pw_path)
                os.remove(out_path)

                local f = io.popen("bash /opt/redpitaya/www/apps/network_manager/scripts/https_export_bundle.sh "
                                   .. pw_path .. " " .. out_path .. " 2>&1")
                local said = f:read("*all")
                f:close()

                local bf = io.open(out_path, "rb")
                local blob = bf and bf:read("*all")
                if bf then bf:close() end
                os.remove(out_path)
                os.remove(pw_path)

                if not blob or #blob == 0 then
                    ngx.status = 500
                    ngx.header["Content-Type"] = "text/plain"
                    ngx.say(said ~= "" and said or "error: the bundle could not be built")
                    return
                end

                ngx.header["Content-Type"] = "application/x-pkcs12"
                ngx.header["Content-Disposition"] =
                    'attachment; filename="redpitaya-' .. (ngx.var.hostname or "board") .. '.p12"'
                ngx.header["Cache-Control"] = "no-store"
                ngx.print(blob)
            }
        }

        location /install_bundle {
            add_header 'Access-Control-Allow-Origin' '*';

            default_type text/plain;

            client_body_buffer_size 512k;
            client_max_body_size 512k;

            content_by_lua_block {
                ngx.req.read_body()
                local ok, payload = pcall(cjson.decode, ngx.req.get_body_data() or "")
                if not ok or type(payload) ~= "table"
                   or type(payload.p12) ~= "string" or payload.p12 == ""
                   or type(payload.password) ~= "string" then
                    ngx.say("error: send the bundle and its password")
                    return
                end

                -- base64 because a .p12 is binary and the rest of this app
                -- speaks JSON.
                local blob = ngx.decode_base64(payload.p12)
                if not blob or #blob == 0 then
                    ngx.say("error: the uploaded bundle is not readable")
                    return
                end

                local p12_path = "/run/rp_https_upload.p12"
                local pw_path  = "/run/rp_https_import_pw"

                local bf = io.open(p12_path, "wb")
                if not bf then ngx.say("error: could not write to /run") return end
                bf:write(blob)
                bf:close()

                local pf = io.open(pw_path, "w")
                if not pf then
                    os.remove(p12_path)
                    ngx.say("error: could not write to /run")
                    return
                end
                pf:write(payload.password)
                pf:close()
                os.execute("chmod 600 " .. p12_path .. " " .. pw_path)

                local f = io.popen("bash /opt/redpitaya/www/apps/network_manager/scripts/https_install_bundle.sh "
                                   .. p12_path .. " " .. pw_path .. " 2>&1")
                local content = f:read("*all")
                f:close()
                ngx.say(content)
            }
        }

        location /acme_request {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'DNT,X-Mx-ReqToken,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type';

            default_type text/plain;

            content_by_lua_block {
                local args    = ngx.req.get_uri_args()
                local domain  = args.domain  or ""
                local email   = args.email   or ""
                local staging = args.staging or "0"

                if not string.match(domain, "^[A-Za-z0-9%.%-]+$") or not string.find(domain, "%.") then
                    ngx.say("error: enter the fully qualified domain name that points at this board")
                    return
                end
                if not string.match(email, "^[A-Za-z0-9%.%_%%%+%-]+@[A-Za-z0-9%.%-]+%.[A-Za-z][A-Za-z]+$") then
                    ngx.say("error: enter a valid e-mail address for the certificate authority to contact")
                    return
                end
                if staging ~= "0" and staging ~= "1" then
                    ngx.say("error: staging must be 0 or 1")
                    return
                end

                local cmd = "bash /opt/redpitaya/www/apps/network_manager/scripts/https_acme.sh '"
                            .. domain .. "' '" .. email .. "' " .. staging .. " 2>&1"
                local f = io.popen(cmd)
                local content = f:read("*all")
                f:close()
                ngx.say(content)
            }
        }

###############################################################################
# wlan0 access point
###############################################################################

        location /wifi_create_point {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'DNT,X-Mx-ReqToken,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type';

            default_type text/plain;

            content_by_lua_block {
                local function shell_escape(s)
                    local sq = string.char(39)
                    local bs = string.char(92)
                    return sq .. tostring(s):gsub(sq, sq .. bs .. sq .. sq) .. sq
                end

                local function is_valid_ssid(s)
                    if not s then return false end
                    local n = #s
                    if n < 1 or n > 32 then return false end
                    if s:find("[%c]") then return false end
                    return true
                end

                local function is_valid_password(s)
                    if not s then return false end
                    local n = #s
                    if n > 0 and (n < 8 or n > 63) then return false end
                    if s:find("[%c]") then return false end
                    return true
                end

                local args = ngx.req.get_uri_args()
                local ssid = args.ssid
                local password = args.password or ""

                if not is_valid_ssid(ssid) then
                    ngx.status = 400
                    ngx.say("error: invalid or missing ssid (1-32 bytes, no control characters)")
                    return
                end

                if not is_valid_password(password) then
                    ngx.status = 400
                    ngx.say("error: invalid password (empty for an open network, otherwise 8-63 characters, no control characters)")
                    return
                end

                local channel = args.channel or "6"
                local hwmode  = args.hwmode  or "n"

                if not tostring(channel):match("^%d%d?$")
                   or tonumber(channel) < 1 or tonumber(channel) > 13 then
                    ngx.status = 400
                    ngx.say("error: channel must be 1 to 13")
                    return
                end
                if hwmode ~= "n" and hwmode ~= "g" then
                    ngx.status = 400
                    ngx.say("error: hwmode must be n or g")
                    return
                end

                -- The AP's own segment. Every one of these is optional; an
                -- absent or empty parameter is passed through as "" and
                -- create_ap.sh applies its default, so an older client that
                -- sends only ssid/password/channel/hwmode still works.
                -- create_ap.sh validates them again and is the authority - it
                -- has to be, since it can also be run from a shell - but a
                -- rejection here costs no interface restart.
                local function one(v)
                    if type(v) == "table" then return nil end
                    if v == nil or v == "" or v == true then return nil end
                    return v
                end

                -- A repeated parameter arrives as a table. Treating that as
                -- "absent" would quietly apply the default instead of the value
                -- the caller sent twice, so name it as the error it is.
                local function opt_ipv4(v, name)
                    if type(v) == "table" then
                        return nil, "error: " .. name .. " was given more than once"
                    end
                    v = one(v)
                    if not v then return "" end
                    local a, b, c, d = v:match("^(%d+)%.(%d+)%.(%d+)%.(%d+)$")
                    if not a or tonumber(a) > 255 or tonumber(b) > 255
                       or tonumber(c) > 255 or tonumber(d) > 255 then
                        return nil, "error: " .. name .. " must be an IPv4 address"
                    end
                    return v
                end

                local function opt_num(v, name, lo, hi)
                    if type(v) == "table" then
                        return nil, "error: " .. name .. " was given more than once"
                    end
                    v = one(v)
                    if not v then return "" end
                    if not v:match("^%d+$") or tonumber(v) < lo or tonumber(v) > hi then
                        return nil, "error: " .. name .. " must be a whole number between "
                                    .. lo .. " and " .. hi
                    end
                    return v
                end

                local ip_args, err = {}, nil
                ip_args.address, err = opt_ipv4(args.address, "address")
                if err then ngx.status = 400; ngx.say(err); return end
                ip_args.netmask, err = opt_ipv4(args.netmask, "netmask")
                if err then ngx.status = 400; ngx.say(err); return end
                ip_args.dns, err = opt_ipv4(args.dns, "dns")
                if err then ngx.status = 400; ngx.say(err); return end
                ip_args.pool_offset, err = opt_num(args.pool_offset, "pool_offset", 1, 254)
                if err then ngx.status = 400; ngx.say(err); return end
                ip_args.pool_size, err = opt_num(args.pool_size, "pool_size", 1, 254)
                if err then ngx.status = 400; ngx.say(err); return end
                ip_args.lease, err = opt_num(args.lease, "lease", 10, 604800)
                if err then ngx.status = 400; ngx.say(err); return end

                local cmd = "/opt/redpitaya/www/apps/network_manager/scripts/create_ap.sh "
                            .. shell_escape(ssid) .. " " .. shell_escape(password) .. " "
                            .. shell_escape(channel) .. " " .. shell_escape(hwmode) .. " "
                            .. shell_escape(ip_args.address) .. " "
                            .. shell_escape(ip_args.netmask) .. " "
                            .. shell_escape(ip_args.pool_offset) .. " "
                            .. shell_escape(ip_args.pool_size) .. " "
                            .. shell_escape(ip_args.lease) .. " "
                            .. shell_escape(ip_args.dns)

                local f = io.popen(cmd)
                local content = f:read("*all")
                f:close()
                ngx.say(content)
            }
        }


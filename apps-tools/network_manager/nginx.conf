        location /set_wifi_country {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'DNT,X-Mx-ReqToken,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type';

            default_type plain/text;

            content_by_lua_block {
                local function shell_escape(s)
                    local sq = string.char(39)
                    local bs = string.char(92)
                    return sq .. tostring(s):gsub(sq, sq .. bs .. sq .. sq) .. sq
                end

                local args = ngx.req.get_uri_args()
                local cc = args.country

                -- Exactly two upper-case letters or digits. The select only
                -- offers codes present in regulatory.db, but the endpoint is
                -- reachable directly, so validate here as well.
                if type(cc) ~= "string" or not cc:match("^[A-Z0-9][A-Z0-9]$") then
                    ngx.status = 400
                    ngx.say("error: country must be two upper-case letters or digits (00 for the world domain)")
                    return
                end

                local cmd = "/opt/redpitaya/www/apps/network_manager/scripts/set_country.sh "
                            .. shell_escape(cc)
                local f = io.popen(cmd)
                local content = f:read("*all")
                f:close()
                ngx.say(content)
            }
        }

        # Exact match, not a prefix: conf/server_common.conf has a
        # "location ~ \.css" regex, and a regex beats any prefix location, so
        # the prefix form never ran this block -- the request went to the static
        # root and 404'd.
        location = /nm_fonts.css {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Cache-Control' 'no-store';

            default_type text/css;

            content_by_lua_block {
                -- Run through bash instead of executing the file directly.
                -- CMake's install(DIRECTORY scripts ...) drops the execute bit,
                -- so the mode a script carries in git is not the mode it has
                -- after a build. The other endpoints here depend on that bit;
                -- this one does not need to, and a stylesheet that quietly
                -- fails would leave the page on its built-in sizes with nothing
                -- to indicate why the config file was ignored.
                local f = io.popen("bash /opt/redpitaya/www/apps/network_manager/scripts/get_ui_config.sh")
                local content = f:read("*all")
                f:close()
                ngx.say(content)
            }
        }

        location /get_wlan0_info {

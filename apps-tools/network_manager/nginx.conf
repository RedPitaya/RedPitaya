            add_header 'Access-Control-Allow-Headers' 'DNT,X-Mx-ReqToken,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type';

            default_type plain/text;

            content_by_lua '
                local bit = require "bit"

                local function mask_to_prefix(mask)
                    local o1, o2, o3, o4 = mask:match("^(%d+)%.(%d+)%.(%d+)%.(%d+)$")
                    if not o1 then return nil end
                    o1, o2, o3, o4 = tonumber(o1), tonumber(o2), tonumber(o3), tonumber(o4)
                    if o1 > 255 or o2 > 255 or o3 > 255 or o4 > 255 then return nil end
                    local n = bit.bor(bit.lshift(o1, 24), bit.lshift(o2, 16), bit.lshift(o3, 8), o4)
                    local prefix = 0
                    for i = 31, 0, -1 do
                        if bit.band(bit.rshift(n, i), 1) == 1 then
                            prefix = prefix + 1
                        else
                            break
                        end
                    end
                    local expected = 0
                    if prefix > 0 then
                        expected = bit.band(bit.lshift(0xFFFFFFFF, 32 - prefix), 0xFFFFFFFF)
                    end
                    if n ~= expected then return nil end
                    return prefix
                end

                local function run(cmd)
                    local rc = os.execute(cmd)
                    return (rc == true) or (rc == 0)
                end

                local args = ngx.req.get_uri_args()

                if not args.address or not args.netmask then
                    ngx.status = 400
                    ngx.say("error: address and netmask are required")
                    return
                end

                local prefix = mask_to_prefix(args.netmask)
                if not prefix then
                    ngx.status = 400
                    ngx.say("error: invalid netmask \\""..tostring(args.netmask).."\\"")
                    return
                end

                local network =          "[Match]\\n"
                      network = network.."Name=eth0\\n"
                      network = network.."[Network]\\n"
                      network = network.."LinkLocalAddressing=yes\\n"
                      network = network.."Address="..args.address.."/"..prefix.."\\n"
                if args.gateway then
                      network = network.."Gateway="..args.gateway.."\\n"
                end
                if args.dns then
                      network = network.."DNS="..args.dns.."\\n"
                end

                -- needed so the write below succeeds; apply_wired_network.sh
                -- re-asserts rw itself, under its lock, before the mv.
                run("rw")

                local unique = ngx.worker.pid().."-"..ngx.var.connection.."-"..ngx.var.connection_requests
                local tmp_path = "/etc/systemd/network/wired.network.tmp."..unique

                local f = io.open(tmp_path, "w")
                if not f then
                    ngx.status = 500
                    ngx.say("error: could not open temporary config file for writing")
                    return
                end
                f:write(network)
                f:flush()
                f:close()
                os.execute("sync")

                local ok = run("/opt/redpitaya/www/apps/network_manager/scripts/apply_wired_network.sh '"..tmp_path.."' eth0")
                if not ok then
                    ngx.status = 500
                    ngx.say("error: failed to apply network configuration (see system log)")
                    return
                end

                os.execute("sleep 1")
                local check = io.popen("ip -4 addr show dev eth0")
                local applied = check:read("*all")
                check:close()

                if applied:find(args.address, 1, true) then
                    ngx.say("ok\\n"..applied)
                else
                    ngx.status = 502
                    ngx.say("warning: requested address "..args.address.." not found on eth0 after apply, current state:\\n"..applied)
                end
            ';
        }



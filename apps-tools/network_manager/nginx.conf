###############################################################################
# eth0
###############################################################################

        location /get_eth0_status {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'DNT,X-Mx-ReqToken,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type';

            default_type plain/text;

            content_by_lua_block {
                local content = ""
                local af = io.popen([[ip -4 addr list eth0]])
                if af then
                    content = af:read("*all") or ""
                    af:close()
                else
                    content = "(could not read eth0 address: failed to run ip)"
                end

                local gateway = ""
                local gf = io.popen([[ip route | grep -Po "(?<=via )(\d{1,3}\.){3}\d{1,3}"]])
                if gf then
                    gateway = gf:read("*all") or ""
                    gf:close()
                else
                    gateway = "(could not read gateway: failed to run ip route)"
                end

                local config
                local f = io.open("/etc/systemd/network/wired.network", "r")
                if f then
                    config = f:read("*all") or ""
                    f:close()
                else
                    config = "(no /etc/systemd/network/wired.network on this board -- interface is unconfigured, likely falling back to DHCP/link-local)"
                end

                ngx.say(content.."\ngateway:"..gateway.."\nconfig:\n"..config)
            }
        }

        location /set_dhcp_client_eth0 {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'DNT,X-Mx-ReqToken,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type';

            default_type plain/text;

            content_by_lua_block {
                local function run(cmd)
                    local rc = os.execute(cmd)
                    return (rc == true) or (rc == 0)
                end

                local network =          "[Match]\n"
                      network = network.."Name=eth0\n"
                      network = network.."[Network]\n"
                      network = network.."LinkLocalAddressing=yes\n"
                      network = network.."DHCP=ipv4\n"
                      network = network.."[DHCP]\n"
                      network = network.."RouteMetric=10\n"
                      network = network.."ClientIdentifier=mac\n"

                run("rw")

                local unique = ngx.worker.pid().."-"..ngx.var.connection.."-"..ngx.var.connection_requests
                local tmp_path = "/etc/systemd/network/wired.network.tmp."..unique

                local f = io.open(tmp_path, "w")
                if not f then
                    ngx.status = 500
                    ngx.say("error: could not open temporary config file for writing")
                    return
                end
                f:write(network)
                f:flush()
                f:close()
                os.execute("sync")

                local ok = run("/opt/redpitaya/www/apps/network_manager/scripts/apply_wired_network.sh '"..tmp_path.."' eth0")
                if not ok then
                    ngx.status = 500
                    ngx.say("error: failed to apply network configuration (see system log)")
                    return
                end

                os.execute("sleep 1")
                local check = io.popen("ip -4 addr show dev eth0")
                local applied = check:read("*all")
                check:close()
                ngx.say("ok\n"..applied)
            }
        }

        location /set_dhcp_server_eth0 {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'DNT,X-Mx-ReqToken,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type';

            default_type plain/text;

            content_by_lua_block {
                local bit = require "bit"

                local function mask_to_prefix(mask)
                    local o1, o2, o3, o4 = mask:match("^(%d+)%.(%d+)%.(%d+)%.(%d+)$")
                    if not o1 then return nil end
                    o1, o2, o3, o4 = tonumber(o1), tonumber(o2), tonumber(o3), tonumber(o4)
                    if o1 > 255 or o2 > 255 or o3 > 255 or o4 > 255 then return nil end
                    local n = bit.bor(bit.lshift(o1, 24), bit.lshift(o2, 16), bit.lshift(o3, 8), o4)
                    local prefix = 0
                    for i = 31, 0, -1 do
                        if bit.band(bit.rshift(n, i), 1) == 1 then
                            prefix = prefix + 1
                        else
                            break
                        end
                    end
                    local expected = 0
                    if prefix > 0 then
                        expected = bit.band(bit.lshift(0xFFFFFFFF, 32 - prefix), 0xFFFFFFFF)
                    end
                    if n ~= expected then return nil end
                    return prefix
                end

                local function run(cmd)
                    local rc = os.execute(cmd)
                    return (rc == true) or (rc == 0)
                end

                -- A repeated query parameter arrives as a table, and a value
                -- goes into a systemd unit file verbatim - including a decoded
                -- %0A, which would append arbitrary directives. Every value
                -- below is therefore taken as a single string and matched
                -- against an exact pattern before it is used.
                local function one(v)
                    if type(v) == "table" then return nil end
                    if v == nil or v == "" or v == true then return nil end
                    return v
                end

                local function ipv4(v)
                    v = one(v)
                    if not v then return nil end
                    local a, b, c, d = v:match("^(%d+)%.(%d+)%.(%d+)%.(%d+)$")
                    if not a then return nil end
                    a, b, c, d = tonumber(a), tonumber(b), tonumber(c), tonumber(d)
                    if a > 255 or b > 255 or c > 255 or d > 255 then return nil end
                    return v, d
                end

                local function posint(v, lo, hi)
                    v = one(v)
                    if not v then return nil end
                    if not v:match("^%d+$") then return nil end
                    local n = tonumber(v)
                    if n < lo or n > hi then return nil end
                    return n
                end

                local args = ngx.req.get_uri_args()

                local address, host_octet = ipv4(args.dhcp_address)
                if not address then
                    ngx.status = 400
                    ngx.say("error: dhcp_address must be an IPv4 address")
                    return
                end

                local prefix = mask_to_prefix(one(args.dhcp_mask) or "")
                if not prefix then
                    ngx.status = 400
                    ngx.say("error: invalid dhcp_mask \""..tostring(args.dhcp_mask).."\"")
                    return
                end

                -- The pool is an offset into the subnet and a count, which is
                -- how systemd expresses it. Defaults match what this endpoint
                -- hard-coded before, so an old client that sends neither gets
                -- the same configuration it used to. A parameter that was sent
                -- but is out of range is rejected rather than replaced by the
                -- default: silently serving a pool nobody asked for is worse
                -- than saying no.
                local pool_offset = posint(args.pool_offset, 1, 254)
                if one(args.pool_offset) and not pool_offset then
                    ngx.status = 400
                    ngx.say("error: pool_offset must be a whole number between 1 and 254")
                    return
                end
                pool_offset = pool_offset or 100

                local pool_size = posint(args.pool_size, 1, 254)
                if one(args.pool_size) and not pool_size then
                    ngx.status = 400
                    ngx.say("error: pool_size must be a whole number between 1 and 254")
                    return
                end
                pool_size = pool_size or 20

                if pool_offset + pool_size - 1 > 254 then
                    ngx.status = 400
                    ngx.say("error: pool of "..pool_size.." starting at "..pool_offset
                            .." runs past the end of the subnet")
                    return
                end

                -- The server's own address must not sit inside the pool it
                -- hands out, or two hosts end up claiming it.
                if host_octet >= pool_offset and host_octet < pool_offset + pool_size then
                    ngx.status = 400
                    ngx.say("error: server address "..address.." is inside the lease pool "
                            ..pool_offset.."-"..(pool_offset + pool_size - 1)
                            ..'; move the pool or the address')
                    return
                end

                local lease = posint(args.lease, 10, 604800)
                if one(args.lease) and not lease then
                    ngx.status = 400
                    ngx.say("error: lease must be a whole number of seconds between 10 and 604800")
                    return
                end

                local router = nil
                if one(args.router) then
                    router = ipv4(args.router)
                    if not router then
                        ngx.status = 400
                        ngx.say("error: router must be an IPv4 address, or empty for this board")
                        return
                    end
                end

                local dns = nil
                if one(args.dns) then
                    dns = ipv4(args.dns)
                    if not dns then
                        ngx.status = 400
                        ngx.say("error: dns must be an IPv4 address, or empty for this board's own resolver")
                        return
                    end
                end

                local network =          "[Match]\n"
                      network = network.."Name=eth0\n"
                      network = network.."[Link]\n"
                      network = network.."RequiredForOnline=no\n"
                      network = network.."[Network]\n"
                      network = network.."DHCPServer=yes\n"
                      network = network.."Address="..address.."/"..prefix.."\n"
                      network = network.."ConfigureWithoutCarrier=yes\n"
                      network = network.."[DHCPServer]\n"
                      network = network.."PoolOffset="..pool_offset.."\n"
                      network = network.."PoolSize="..pool_size.."\n"
                if lease then
                      network = network.."DefaultLeaseTimeSec="..lease.."\n"
                      network = network.."MaxLeaseTimeSec="..lease.."\n"
                end
                      network = network.."EmitDNS=yes\n"
                if dns then
                      network = network.."DNS="..dns.."\n"
                end
                -- What clients are told to use as their default route. With no
                -- router given, EmitRouter=yes has systemd advertise this
                -- board, which is the point of serving DHCP here. Note this is
                -- a DHCP option handed to clients, not a route installed on the
                -- board - the previous "[Route] Gateway=" set the latter, which
                -- is not a DHCP server setting and pointed the board's own
                -- egress at an address on the segment it serves.
                      network = network.."EmitRouter=yes\n"
                if router then
                      network = network.."Router="..router.."\n"
                end

                run("rw")

                local unique = ngx.worker.pid().."-"..ngx.var.connection.."-"..ngx.var.connection_requests
                local tmp_path = "/etc/systemd/network/wired.network.tmp."..unique

                local f = io.open(tmp_path, "w")
                if not f then
                    ngx.status = 500
                    ngx.say("error: could not open temporary config file for writing")
                    return
                end
                f:write(network)
                f:flush()
                f:close()
                os.execute("sync")

                local ok = run("/opt/redpitaya/www/apps/network_manager/scripts/apply_wired_network.sh '"..tmp_path.."' eth0")
                if not ok then
                    ngx.status = 500
                    ngx.say("error: failed to apply network configuration (see system log)")
                    return
                end

                os.execute("sleep 1")
                local check = io.popen("ip -4 addr show dev eth0")
                local applied = check:read("*all")
                check:close()

                if applied:find(args.dhcp_address, 1, true) then
                    ngx.say("ok\n"..applied)
                else
                    ngx.status = 502
                    ngx.say("warning: requested address "..args.dhcp_address.." not found on eth0 after apply, current state:\n"..applied)
                end
            }
        }

        location /set_static_eth0 {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'DNT,X-Mx-ReqToken,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type';

            default_type plain/text;

            content_by_lua_block {
                local bit = require "bit"

                local function mask_to_prefix(mask)
                    local o1, o2, o3, o4 = mask:match("^(%d+)%.(%d+)%.(%d+)%.(%d+)$")
                    if not o1 then return nil end
                    o1, o2, o3, o4 = tonumber(o1), tonumber(o2), tonumber(o3), tonumber(o4)
                    if o1 > 255 or o2 > 255 or o3 > 255 or o4 > 255 then return nil end
                    local n = bit.bor(bit.lshift(o1, 24), bit.lshift(o2, 16), bit.lshift(o3, 8), o4)
                    local prefix = 0
                    for i = 31, 0, -1 do
                        if bit.band(bit.rshift(n, i), 1) == 1 then
                            prefix = prefix + 1
                        else
                            break
                        end
                    end
                    local expected = 0
                    if prefix > 0 then
                        expected = bit.band(bit.lshift(0xFFFFFFFF, 32 - prefix), 0xFFFFFFFF)
                    end
                    if n ~= expected then return nil end
                    return prefix
                end

                local function run(cmd)
                    local rc = os.execute(cmd)
                    return (rc == true) or (rc == 0)
                end

                -- Same guards as the DHCP server endpoint: a repeated parameter
                -- arrives as a table, an empty one is truthy in Lua and would
                -- emit a bare "Gateway=" line, and a value goes into a systemd
                -- unit verbatim - including a decoded %0A.
                local function one(v)
                    if type(v) == "table" then return nil end
                    if v == nil or v == "" or v == true then return nil end
                    return v
                end

                local function ipv4(v)
                    v = one(v)
                    if not v then return nil end
                    local a, b, c, d = v:match("^(%d+)%.(%d+)%.(%d+)%.(%d+)$")
                    if not a then return nil end
                    if tonumber(a) > 255 or tonumber(b) > 255
                       or tonumber(c) > 255 or tonumber(d) > 255 then return nil end
                    return v
                end

                local args = ngx.req.get_uri_args()

                local address = ipv4(args.address)
                if not address then
                    ngx.status = 400
                    ngx.say("error: address must be an IPv4 address")
                    return
                end

                local prefix = mask_to_prefix(one(args.netmask) or "")
                if not prefix then
                    ngx.status = 400
                    ngx.say("error: invalid netmask \""..tostring(args.netmask).."\"")
                    return
                end

                local gateway = nil
                if one(args.gateway) then
                    gateway = ipv4(args.gateway)
                    if not gateway then
                        ngx.status = 400
                        ngx.say("error: gateway must be an IPv4 address, or empty")
                        return
                    end
                end

                local dns = nil
                if one(args.dns) then
                    dns = ipv4(args.dns)
                    if not dns then
                        ngx.status = 400
                        ngx.say("error: dns must be an IPv4 address, or empty")
                        return
                    end
                end

                local network =          "[Match]\n"
                      network = network.."Name=eth0\n"
                      network = network.."[Network]\n"
                -- LinkLocalAddressing=yes means "ipv4 and ipv6", so networkd
                -- also assigned a 169.254.0.0/16 address next to the static one.
                -- On an interface whose address was stated explicitly that is
                -- noise: two addresses, an extra metric-2048 route, and the
                -- first "inet" line in "ip addr" is the one nobody configured.
                -- IPv4LL is a fallback for having no address, and it rescues
                -- nothing here - a board reachable only at an address nobody can
                -- predict is not reachable. ipv6 keeps the link-local fe80::
                -- address, which is normal and which systemd defaults to.
                      network = network.."LinkLocalAddressing=ipv6\n"
                      network = network.."Address="..address.."/"..prefix.."\n"
                if gateway then
                      network = network.."Gateway="..gateway.."\n"
                end
                if dns then
                      network = network.."DNS="..dns.."\n"
                end

                run("rw")

                local unique = ngx.worker.pid().."-"..ngx.var.connection.."-"..ngx.var.connection_requests
                local tmp_path = "/etc/systemd/network/wired.network.tmp."..unique

                local f = io.open(tmp_path, "w")
                if not f then
                    ngx.status = 500
                    ngx.say("error: could not open temporary config file for writing")
                    return
                end
                f:write(network)
                f:flush()
                f:close()
                os.execute("sync")

                local ok = run("/opt/redpitaya/www/apps/network_manager/scripts/apply_wired_network.sh '"..tmp_path.."' eth0")
                if not ok then
                    ngx.status = 500
                    ngx.say("error: failed to apply network configuration (see system log)")
                    return
                end

                os.execute("sleep 1")
                local check = io.popen("ip -4 addr show dev eth0")
                local applied = check:read("*all")
                check:close()

                if applied:find(args.address, 1, true) then
                    ngx.say("ok\n"..applied)
                else
                    ngx.status = 502
                    ngx.say("warning: requested address "..args.address.." not found on eth0 after apply, current state:\n"..applied)
                end
            }
        }



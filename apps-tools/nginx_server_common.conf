#
# Body shared by the plain server on port 80 (conf/nginx.conf) and the TLS
# server the Network Manager generates under /etc/redpitaya/nginx/http/, so
# both behave identically and there is one copy to keep in step.
#
# Included from inside a server { } block -- it must not open one itself.
#

        expires off;

        keepalive_timeout 0;

        access_log /dev/null;

        #gzip on;
        #gzip_http_version 1.0;
        #gzip_vary on;
        #gzip_comp_level 6;
        #gzip_proxied any;
        #gzip_types application/json;
        #gzip_buffers 16 8k;
        #gzip_buffers 128 4k;
        #gzip_disable "MSIE [1-6]\.(?!.*SV1)";

        root /opt/redpitaya/www/apps;
        include ../apps/*/nginx.conf;

        location / {

            content_by_lua_block {
                local handle = io.popen("/opt/redpitaya/www/apps/scpi_manager/check_service.sh")
                local result = handle:read("*a")
                handle:close()
                if string.match(result, "running") then
                    return ngx.exec("@scpi")
                end
                -- the streaming server runs as a service (OS 3.04): the root page is its page, as for
                -- SCPI. Only the root: this location also serves every page without one of its own,
                -- the streaming page among them (a redirect of it would loop).
                if ngx.var.uri == "/" then
                    local stream = io.popen("systemctl is-active redpitaya_streaming.service 2>/dev/null")
                    local state = stream:read("*a") or ""
                    stream:close()
                    if string.match(state, "^active") then
                        -- a redirect of the browser: the page takes its scripts by relative paths
                        return ngx.redirect("/streaming_manager/", 302)
                    end
                end
                return ngx.exec("@apps")
            }
        }

        location @apps {
                add_header Cache-Control "no-cache, no-store, must-revalidate";
                add_header Pragma "no-cache";
                add_header Expires 0;
        }

        location @scpi {
                add_header Cache-Control "no-cache, no-store, must-revalidate";
                add_header Pragma "no-cache";
                add_header Expires 0;
                rewrite ^/$ /scpi_manager;
        }


        location ~ ^/tmp {
            root /;
        }

        location ~ ^/log {
            root /var/;
        }

        location ~ \.css {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'DNT,X-Mx-ReqToken,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type';

            default_type text/css;
            add_header  Content-Type    text/css;

            # kill cache
            add_header Cache-Control 'no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0';
            if_modified_since off;
            expires off;
            etag off;
        }

        location ~ \.js {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'DNT,X-Mx-ReqToken,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type';

            default_type application/x-javascript;
            add_header  Content-Type    application/x-javascript;
            # kill cache
            add_header Cache-Control 'no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0';
            if_modified_since off;
            expires off;
            etag off;
        }

        client_body_buffer_size 1M;
        client_max_body_size 0;

        rp_bazaar_dir     /opt/redpitaya/www/apps;
        rp_bazaar_server  http://bazaar.redpitaya.com;
        rp_tmp_dir        /tmp;

        location /bazaar {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'DNT,X-Mx-ReqToken,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type';

            rp_module_cmd;
        }

        location /wss {
            proxy_pass http://websocket;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        location /check_inet {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'DNT,X-Mx-ReqToken,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type';

            default_type application/json;

            content_by_lua_file /opt/redpitaya/www/conf/lua/online.lua;
        }

        location /data {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'DNT,X-Mx-ReqToken,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type';

                 rp_module_cmd;
        }

        location /reboot {
            content_by_lua '
                os.execute("/opt/redpitaya/sbin/reboot.sh");
                ngx.say("OK")
            ';
        }

        location /poweroff {
            content_by_lua '
                os.execute("/opt/redpitaya/sbin/poweroff.sh");
                ngx.say("OK")
            ';
        }

        # Changes the root password: POST {"password": "..."} as application/json.
        # No CORS headers on purpose: a page of another site cannot send this request
        # from the browser of the user (the JSON content type needs a preflight).
        # The password goes to chpasswd through stdin: never in the URL or the logs.
        location = /set_root_password {
            default_type text/plain;

            content_by_lua_block {
                local function reply(status, text)
                    ngx.status = status
                    ngx.say(text)
                    return ngx.exit(status)
                end

                local function rootHash()
                    local f = io.open("/etc/shadow", "r")
                    if f == nil then
                        return nil
                    end
                    for line in f:lines() do
                        local hash = line:match("^root:([^:]*):")
                        if hash then
                            f:close()
                            return hash
                        end
                    end
                    f:close()
                    return nil
                end

                if ngx.req.get_method() ~= "POST" then
                    return reply(ngx.HTTP_NOT_ALLOWED, "POST only")
                end
                local ctype = ngx.var.content_type or ""
                if not ctype:find("application/json", 1, true) then
                    return reply(ngx.HTTP_BAD_REQUEST, "The request must be application/json")
                end

                ngx.req.read_body()
                local body = ngx.req.get_body_data()
                if body == nil then
                    return reply(ngx.HTTP_BAD_REQUEST, "Empty request")
                end
                local ok, req = pcall(cjson.decode, body)
                if not ok or type(req) ~= "table" or type(req.password) ~= "string" then
                    return reply(ngx.HTTP_BAD_REQUEST, "Wrong request")
                end

                local password = req.password
                if #password == 0 or #password > 128 then
                    return reply(ngx.HTTP_BAD_REQUEST, "The password must be 1 to 128 characters long")
                end
                -- chpasswd takes one "user:password" line; control characters would break it
                if password:find("[%c]") then
                    return reply(ngx.HTTP_BAD_REQUEST, "The password must not contain control characters")
                end

                -- the exit code of a popen pipe is not available here: the hash in
                -- /etc/shadow changes on success (chpasswd always takes a new salt)
                local before = rootHash()
                local pipe = io.popen("/usr/sbin/chpasswd 2>/dev/null", "w")
                if pipe == nil then
                    return reply(ngx.HTTP_INTERNAL_SERVER_ERROR, "Cannot run chpasswd")
                end
                pipe:write("root:" .. password .. "\n")
                pipe:close()
                local after = rootHash()

                if after == nil or after == before then
                    return reply(ngx.HTTP_INTERNAL_SERVER_ERROR, "The password was not changed")
                end
                ngx.log(ngx.WARN, "the root password was changed from the web interface by ", ngx.var.remote_addr)
                return reply(ngx.HTTP_OK, "OK")
            }
        }


        location /check_nginx_live {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'DNT,X-Mx-ReqToken,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type';

            default_type text/plain;

            content_by_lua '
                ngx.say("OK")
            ';
        }

        location /set_client_id {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'DNT,X-Mx-ReqToken,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type';

            default_type text/plain;

            content_by_lua '
                local file = io.open("/usr/local/etc/client_id", "w");
                ngx.req.read_body();
                io.output(file):write(ngx.var.request_body);
                io.flush(file);
                io.close(file);
                ngx.say("OK");
            ';
        }

        location /get_client_id {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'DNT,X-Mx-ReqToken,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type';

            default_type text/plain;

            content_by_lua '
                local f = io.open("/usr/local/etc/client_id", "r")
                if f then
                    local content = f:read("*all")
                    f:close()
                    ngx.say(content)
                else
                    ngx.say("")
                end
            ';
        }

        location /get_led_status {
            content_by_lua '
                local f = io.popen("/opt/redpitaya/bin/led_control -z")
                local content = f:read("*all")
                f:close()
                ngx.say(content)
            ';
        }

        location /get_bug_report {
            client_max_body_size 10M;
            client_body_buffer_size 10M;

            content_by_lua '

                local f_rep = io.open("/tmp/bug_rep_out.zip", "rb")
                local content = f_rep:read("a")
                f_rep:close()

                ngx.header["Access-Control-Allow-Origin"]= "*";
                ngx.header["Access-Control-Allow-Methods"]= "GET, POST, OPTIONS";
                ngx.header["Access-Control-Allow-Headers"]= "DNT,X-Mx-ReqToken,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type";
                ngx.header["Content-type"] = "application/zip";
                ngx.header["Content-Disposition"] = "attachment; filename=test.zip"

                ngx.say(content)
            ';
        }

        location /set_led_status {
            content_by_lua '
                local args     = ngx.req.get_uri_args()
                local enable   = args.enable    or 0
                if enable then
                    if enable == "true" then
                        local f = io.popen("/opt/redpitaya/bin/led_control -y=On -e=On -r=On")
                        local content = f:read("*all")
                        f:close()
                        ngx.say(content)
                    else
                        local f = io.popen("/opt/redpitaya/bin/led_control -y=Off -e=Off -r=Off")
                        local content = f:read("*all")
                        f:close()
                        ngx.say(content)
                    end
                end
                ngx.say("")
            ';
        }

        location /get_fsck_status {
            content_by_lua '
                local f = io.popen("/usr/sbin/tune2fs -l /dev/mmcblk0p2 | grep \'Maximum mount count\'")
                local content = f:read("*all")
                f:close()
                ngx.say(content)
            ';
        }

        location /set_fsck {
            content_by_lua '
                local args     = ngx.req.get_uri_args()
                local count   = args.enable    or 0
                if count then
                    if count == "true" then
                        local f = io.popen("/usr/sbin/tune2fs -c 1 /dev/mmcblk0p2")
                        local content = f:read("*all")
                        f:close()
                        ngx.say(content)
                    else
                        local f = io.popen("/usr/sbin/tune2fs -c -1 /dev/mmcblk0p2")
                        local content = f:read("*all")
                        f:close()
                        ngx.say(content)
                    end
                end
                ngx.say("")
            ';
        }


        # Web Console. shellinabox listens on 4200 with --disable-ssl
        # (/etc/default/shellinabox) and speaks nothing else, so reaching it
        # directly means plain http even when the board serves https. Proxied
        # here it uses the board's port and certificate instead; its assets are
        # linked relatively, so serving it under a prefix works.
        location = /console { return 301 /console/; }

        # "^~" so the regex locations for .css and .js above do not take the
        # console's own assets away from it.
        location ^~ /console/ {
            proxy_pass http://127.0.0.1:4200/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            # The terminal holds a long poll open and expects its output
            # unbuffered.
            proxy_buffering off;
            proxy_read_timeout 1d;
        }

        # The websocket servers on 9091, 9092, 9099 and 9900, also reachable
        # through nginx: a page loaded over https cannot open a plain ws://
        # connection to them. The application scripts pick these paths there.
        location /wsc {
            proxy_pass http://ws_ctrl;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 1d;
        }

        location /wsu {
            proxy_pass http://ws_update;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 1d;
        }

        location /wsm {
            proxy_pass http://ws_menu;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 1d;
        }

        location /wsd {
            proxy_pass http://ws_stream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 1d;
        }

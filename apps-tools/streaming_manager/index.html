<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Red Pitaya - Stream server</title>
    <link rel="stylesheet" href="../assets/loader.css?1">
    <link rel="stylesheet" href="../assets/lpulse.css?1">
    <link rel="stylesheet" href="../assets/usermis.css?1">
    <link rel="stylesheet" href="css/style.css?7">
    <script src="js/net.js?7"></script>
    <script src="js/app.js?7"></script>
</head>

<body class="user_lost connection_lost">
    <div id="loader-wrapper">
        <div id="loader"></div>
    </div>
    <div id="user-wrapper">
        <div id="user"></div>
        <div id="user-desc">Device is already in use by another user.</div>
    </div>
    <div id="pulse-wrapper">
        <div id="pulse"></div>
        <div id="pulse-desc">Connection with device is lost.</div>
    </div>

    <div id="app" class="app hidden">
        <div id="strip" class="strip">&nbsp;</div>
        <header class="app-h">
            <a href="/" id="exit" title="Exit: stop the streaming server and go to the applications" aria-label="Exit: stop the streaming server and go to the applications" style="display: flex; align-items: center"><img src="../assets/images/navigation_arrow_left.png" alt="" style="height: 22px"></a>
            <img src="../assets/images/navigation_logo.png" alt="Red Pitaya" style="width: 110px">
            <div class="title">Stream server application</div>
            <div class="tail">
                <a href="https://redpitaya.readthedocs.io/en/latest/appsFeatures/applications/streaming/appStreaming.html" target="_blank" rel="noopener" aria-label="Help" style="display: flex"><img src="img/help_icon.png" alt="" style="width: 26px; height: 26px"></a>
            </div>
        </header>
        <div class="app-b">
            <nav id="nav" class="app-nav" aria-label="Sections"></nav>
            <main id="main" class="app-main"></main>
        </div>
    </div>
</body>

</html>

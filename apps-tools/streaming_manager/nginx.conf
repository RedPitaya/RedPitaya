location /streaming_manager/upload {

    client_max_body_size 15g;

    alias /home/redpitaya/streaming_files;

    dav_access user:rw group:rw all:rw;

    dav_methods PUT DELETE MKCOL COPY MOVE;
    autoindex on;
    autoindex_exact_size off;
    autoindex_localtime on;
}

location /streaming_manager/clients {

    client_max_body_size 15g;

    alias /opt/redpitaya/streaming;

    dav_access user:rw group:rw all:rw;

    dav_methods PUT DELETE MKCOL COPY MOVE;
    autoindex on;
    autoindex_exact_size off;
    autoindex_localtime on;
}


location /streaming_manager_get_clients_list {
    add_header 'Access-Control-Allow-Origin' '*';
    add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
    add_header 'Access-Control-Allow-Headers' 'DNT,X-Mx-ReqToken,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type';

    default_type text/plain;

    content_by_lua '
        local f = io.popen("ls -1 /opt/redpitaya/streaming/")
        local f_content = f:read("*all")
        f:close()
        ngx.say(f_content)
    ';
}

location /get_streaming_ip {
    add_header 'Access-Control-Allow-Origin' '*';
    add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
    add_header 'Access-Control-Allow-Headers' 'DNT,X-Mx-ReqToken,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type';

    default_type application/json;

    content_by_lua '
        local eth = io.popen("ip -4 addr list eth0")
        local wlan = io.popen("ip -4 addr list wlan0")
        local eth_content = eth:read("*all")
        local wlan_content = wlan:read("*all")
        eth:close()
        wlan:close()
        ngx.say(eth_content..";"..wlan_content)
    ';
}

location /upload_dac_file {
    add_header 'Access-Control-Allow-Origin' '*';
    add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
    add_header 'Access-Control-Allow-Headers' 'DNT,X-Mx-ReqToken,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type';

    client_max_body_size 15g;
    client_body_in_file_only on;
    default_type text/plain;

    # The body goes into the DAC directory under the name given in ?file=. The name is a file
    # name only (the rule of CStreamSettings::isValidFileName): no shell, no path.
    content_by_lua_block {
        if ngx.req.get_method() ~= "POST" then
            ngx.status = ngx.HTTP_NOT_ALLOWED
            ngx.say("ERROR: Unsupported request method")
            return
        end
        local name = ngx.req.get_uri_args()["file"]
        if type(name) ~= "string" or name == "" or #name > 255 or name == "." or name == ".."
            or name:find("[/\\%z%c]") then
            ngx.status = ngx.HTTP_BAD_REQUEST
            ngx.say("ERROR: Bad file name")
            return
        end
        ngx.req.read_body()
        local body = ngx.req.get_body_file()
        local src = body and io.open(body, "rb")
        if not src then
            ngx.status = ngx.HTTP_BAD_REQUEST
            ngx.say("ERROR: No file uploaded")
            return
        end
        local dir = "/home/redpitaya/streaming_files/dac/"
        local part = dir .. ".upload." .. ngx.worker.pid() .. "." .. ngx.now()
        local dst = io.open(part, "wb")
        if not dst then
            src:close()
            ngx.status = ngx.HTTP_INTERNAL_SERVER_ERROR
            ngx.say("ERROR: Can not write the file")
            return
        end
        local ok = true
        while true do
            local chunk = src:read(1048576)
            if not chunk then
                break
            end
            if not dst:write(chunk) then
                ok = false
                break
            end
        end
        src:close()
        ok = dst:close() and ok
        -- the file shows up whole or not at all
        if not ok or not os.rename(part, dir .. name) then
            os.remove(part)
            ngx.status = ngx.HTTP_INTERNAL_SERVER_ERROR
            ngx.say("ERROR: Can not write the file")
            return
        end
        ngx.say("OK")
    }
}

# free and total bytes of the card under the streaming files: "<free> <total>"
location /streaming_manager_sd_free {
    add_header 'Access-Control-Allow-Origin' '*';
    default_type text/plain;

    content_by_lua '
        local f = io.popen("df -B1 --output=avail,size /home/redpitaya/streaming_files 2>/dev/null | tail -n 1")
        local f_content = f:read("*all")
        f:close()
        ngx.say(f_content)
    ';
}

# The page talks to streaming-server, which runs as redpitaya_streaming.service (OS 3.04): the
# streams go on while no page is open. The WebSocket of the page backend listens on 127.0.0.1.
location /streaming_ws {
    proxy_pass http://127.0.0.1:18906;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 1d;
}

# GET: {"unit":true|false,"active":"active|inactive|activating|failed|...","scpi":"..."}
# POST ?cmd=start: start and enable the service (it stops the SCPI server: both own the FPGA);
# POST ?cmd=stop: stop and disable it. The page stops the bazaar application before a start.
location /streaming_manager_service {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    default_type application/json;

    content_by_lua_block {
        local unit = "redpitaya_streaming.service"
        local function sh(cmd)
            local f = io.popen(cmd .. " 2>/dev/null")
            local r = f:read("*a") or ""
            f:close()
            return (r:gsub("%s+$", ""))
        end
        local cmd = ngx.var.arg_cmd
        if cmd == "start" or cmd == "stop" then
            if ngx.req.get_method() ~= "POST" then
                ngx.status = ngx.HTTP_NOT_ALLOWED
                ngx.say('{"error":"POST only"}')
                return
            end
            if cmd == "start" then
                os.execute("systemctl start " .. unit)
                os.execute("systemctl --no-reload enable " .. unit .. " >/dev/null 2>&1")
            else
                -- the server closes its recordings first (the SD card may take tens of seconds):
                -- do not hold the only nginx worker, the page polls the state instead
                os.execute("systemctl --no-reload disable " .. unit .. " >/dev/null 2>&1")
                os.execute("systemctl --no-block stop " .. unit)
            end
        elseif cmd ~= nil then
            ngx.status = ngx.HTTP_BAD_REQUEST
            ngx.say('{"error":"cmd is start or stop"}')
            return
        end
        local present = sh("systemctl list-unit-files --no-legend " .. unit) ~= ""
        local active = sh("systemctl is-active " .. unit)
        local scpi = sh("systemctl is-active redpitaya_scpi.service")
        ngx.say(string.format('{"unit":%s,"active":"%s","scpi":"%s"}', present and "true" or "false",
            active:gsub('[^%w%-]', ''), scpi:gsub('[^%w%-]', '')))
    }
}

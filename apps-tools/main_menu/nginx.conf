location /resizeDMA {
    add_header 'Access-Control-Allow-Origin' '*';
    add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
    add_header 'Access-Control-Allow-Headers' 'DNT,X-Mx-ReqToken,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type';

    default_type plain/text;

    # new_size goes to a shell command line and into the device tree: a hex number only
    content_by_lua_block {
        local new_size = ngx.req.get_uri_args()["new_size"] or "0x2000000"
        if type(new_size) ~= "string" or not new_size:match("^0x%x%x?%x?%x?%x?%x?%x?%x?$") then
            ngx.status = ngx.HTTP_BAD_REQUEST
            ngx.say("ERROR: new_size must be a hex number 0x1..0xFFFFFFFF")
            return
        end

        local f = io.popen("/opt/redpitaya/www/apps/main_menu/scripts/resizeDMA.sh " .. new_size)
        local content = f:read("*all")
        f:close()
        ngx.say(content)
    }
}


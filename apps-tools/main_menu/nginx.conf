# Removes stored application settings: POST {"dir": "<directory>"} or {"all": true} as
# application/json. No CORS headers: another site cannot send it from the browser of the user.
location = /settings_remove {
    default_type application/json;
    content_by_lua_block {
        local function reply(status, text)
            ngx.status = status
            ngx.say(text)
            return ngx.exit(status)
        end
        if ngx.req.get_method() ~= "POST" then
            return reply(ngx.HTTP_NOT_ALLOWED, '{"ok":false,"error":"POST only"}')
        end
        local ctype = ngx.var.content_type or ""
        if not ctype:find("application/json", 1, true) then
            return reply(ngx.HTTP_BAD_REQUEST, '{"ok":false,"error":"the request must be application/json"}')
        end
        ngx.req.read_body()
        local ok, req = pcall(cjson.decode, ngx.req.get_body_data() or "")
        if not ok or type(req) ~= "table" then
            return reply(ngx.HTTP_BAD_REQUEST, '{"ok":false,"error":"wrong request"}')
        end
        local cmd
        if req.all == true then
            cmd = "remove-all"
        elseif type(req.dir) == "string" and req.dir:match("^[%w_%-]+$") then
            cmd = "remove " .. req.dir
        else
            return reply(ngx.HTTP_BAD_REQUEST, '{"ok":false,"error":"wrong directory"}')
        end
        local f = io.popen("/opt/redpitaya/www/apps/main_menu/scripts/settings.sh " .. cmd)
        local content = f:read("*all")
        f:close()
        ngx.say(content)
    }
}

# The password of Jupyter: POST {"password": "..."} as application/json, an empty one removes it.
# No CORS headers (as /set_root_password); the password goes to the script through stdin.
location = /set_jupyter_password {
    default_type application/json;
    content_by_lua_block {
        local function reply(status, text)
            ngx.status = status
            ngx.say(text)
            return ngx.exit(status)
        end
        if ngx.req.get_method() ~= "POST" then
            return reply(ngx.HTTP_NOT_ALLOWED, '{"ok":false,"error":"POST only"}')
        end
        local ctype = ngx.var.content_type or ""
        if not ctype:find("application/json", 1, true) then
            return reply(ngx.HTTP_BAD_REQUEST, '{"ok":false,"error":"the request must be application/json"}')
        end
        ngx.req.read_body()
        local ok, req = pcall(cjson.decode, ngx.req.get_body_data() or "")
        if not ok or type(req) ~= "table" or type(req.password) ~= "string" then
            return reply(ngx.HTTP_BAD_REQUEST, '{"ok":false,"error":"wrong request"}')
        end
        local password = req.password
        if #password > 128 then
            return reply(ngx.HTTP_BAD_REQUEST, '{"ok":false,"error":"the password must be at most 128 characters long"}')
        end
        if password:find("[%c]") then
            return reply(ngx.HTTP_BAD_REQUEST, '{"ok":false,"error":"the password must not contain control characters"}')
        end
        local script = "/opt/redpitaya/www/apps/main_menu/scripts/settings.sh"
        local pipe = io.popen(script .. " jupyter-password >/dev/null 2>&1", "w")
        if pipe == nil then
            return reply(ngx.HTTP_INTERNAL_SERVER_ERROR, '{"ok":false,"error":"the script does not run"}')
        end
        pipe:write(password .. "\n")
        pipe:close()
        -- the exit code of a popen pipe is not available here: the state tells
        local f = io.popen(script .. " status")
        local st = f:read("*all")
        f:close()
        local want = #password > 0 and '"jupyter_password":true' or '"jupyter_password":false'
        if not st:find(want, 1, true) then
            return reply(ngx.HTTP_INTERNAL_SERVER_ERROR, '{"ok":false,"error":"the password was not changed"}')
        end
        ngx.log(ngx.WARN, "the Jupyter password was ", #password > 0 and "set" or "removed", " from the web interface by ", ngx.var.remote_addr)
        return reply(ngx.HTTP_OK, '{"ok":true}')
    }
}
